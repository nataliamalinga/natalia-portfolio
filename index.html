<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natalia Malinga — Projektowanie wnętrz</title>
<meta name="description" content="Strona w przygotowaniu. Projekty wnętrz pełne pasji i stylu — wkrótce online.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --plaster: #EDE6D8;
    --plaster-light: #F7F3EA;
    --ink: #26241F;
    --ink-soft: #4A473E;
    --brass: #A8763E;
    --brass-light: #C79A5F;
    --stone: #8A8570;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background-color: var(--plaster);
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero__bg {
    position: absolute;
    inset: 0;
    background-image: url('assets/hero-bg.webp');
    background-size: cover;
    background-position: center 35%;
  }

  /* Delikatna nakładka w tonie plastra, żeby tekst miał kontrast niezależnie od jasności zdjęcia */
  .hero__overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(247, 243, 234, 0.35) 0%,
      rgba(247, 243, 234, 0.15) 30%,
      rgba(237, 230, 216, 0.55) 100%
    );
  }

  .hero__content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 44rem;
  }

  .hero__name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.01em;
    margin: 0 0 0.75rem;
    color: var(--ink);
    text-shadow: 0 2px 24px rgba(247, 243, 234, 0.6);
  }

  .hero__tagline {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    color: var(--ink-soft);
    margin: 0 0 3rem;
    text-shadow: 0 2px 20px rgba(247, 243, 234, 0.6);
  }

  .hero__status {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'IBM Plex Mono', 'Inter', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(247, 243, 234, 0.75);
    border: 1px solid rgba(38, 36, 31, 0.15);
    padding: 0.7rem 1.4rem;
    border-radius: 2px;
    backdrop-filter: blur(2px);
  }

  .hero__status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    flex-shrink: 0;
  }

  .hero__footer {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    text-shadow: 0 1px 12px rgba(247, 243, 234, 0.7);
  }

  .hero__footer a {
    color: var(--brass);
    text-decoration: none;
    font-weight: 500;
  }

  .hero__footer a:hover,
  .hero__footer a:focus-visible {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .hero__bg {
      background-position: 30% center;
    }
    .hero__status {
      font-size: 0.7rem;
      padding: 0.6rem 1rem;
    }
    .hero__footer {
      bottom: 1.25rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero__bg"></div>
  <div class="hero__overlay"></div>

  <div class="hero__content">
    <h1 class="hero__name">Natalia Malinga</h1>
    <p class="hero__tagline">Projekty pełne pasji i stylu</p>
    <span class="hero__status">Strona w budowie</span>
  </div>

  <div class="hero__footer">
    © 2026 Natalia Malinga · <a href="mailto:natalia.malinga@gmail.com">natalia.malinga@gmail.com</a>
  </div>
</div>

</body>
</html>
